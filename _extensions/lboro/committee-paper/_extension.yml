title: Loughborough Committee Paper
author: Simon Martin
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    docx:
      reference-doc: reference.docx
      toc: false
    pdf:
      documentclass: article
      papersize: a4
      fontsize: 12pt
      geometry:
        - top=12mm
        - bottom=16mm
        - left=15mm
        - right=15mm
      linestretch: 1.5
      include-in-header: pdf-header.tex
      template-partials:
        - before-body.tex
        - after-body.tex
